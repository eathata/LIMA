<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section>
        <h1>Formulário</h1>
        <form action="cadastro.php" method="post">
            <p><label>Nome:</label>
            <input type="text" name="nome" placeholder="Digite seu nome" required>
            </p>
            <p><label>Senha:</label>
            <input type="password" name="senha" required maxlength="8">
            </p>
            <p><label>Telefone:</label>
            <input type="text" name="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" placeholder="(00) 00000-0000" required  title="Use o formato: (99) 99999-9999 ">
            </p>
            <p><label>Email:</label>
            <input type="email" name="email" placeholder="email" required>
            </p>
            <p><label>CEP:</label>
            <input type="text" name="cep" pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000" required title="Use o formato 00000-000">
            </p>
            <p><label>Sobre você:</label>
            <textarea name="sobre" cols="100" rows="10"></textarea>
            </p>
            <p><label>Gênero:</label>
            <input type="radio" name="genero" value="M" required> Masculino
            <input type="radio" name="genero" value="F"> Feminino 
            </p>
            <p><label>Interesses:</label>
            <input type="checkbox" name="interesses[]" value="tecnologia"> Tecnologia
            <input type="checkbox" name="interesses[]" value="música"> Música
            <input type="checkbox" name="interesses[]" value="artes"> Livros
            </p>
            <p><label>Pais:</label>
            <select name="pais" required>
                <option value="">-------------</option>
                <option value="brasil">Brasil</option>
                <option value="argentina">Argentina</option>
                <option value="chile">Chile</option>
            </select>
            </p>
            <p><label>Foto de perfil</label></p>
            <input type="file" name="foto"">
            <br><br>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </form>
    </section>
</body>
</html>
