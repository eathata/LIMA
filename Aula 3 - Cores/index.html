<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cores</title>
</head>
<body>
    <header>
        <h1>Cores, imagens e links</h1>
    </header>
    <main>
        <section>
            <h2>Formatos de cores no CSS</h2>
            <h2 style="color: #FF5733;">Cores em hexadecimal</h2>
            <h2 style="color: rgba(0, 128, 255);">Cores em RGB</h2>
            <h2 style="color: rgb(0, 128, 0, 0.6)">Cores em RGB</h2>
        </section>
        <hr>
        <section>
            <p style="color: blue;">Texto com cor específica</p>
            <p style="background-color: rgb(0 0 0); color: white;">Fundo do texto em uma cor específica</p>
        </section>
        <hr>
        <section>
            <!--IMAGEM COMO ELEMTNO DA PÁGINA-->
            <img src="assets/Imagem.jpg" alt="Teste" title="Teste" width="500">
        </section>
        <hr>
        <section>
            <div style="border: 1px solid red; width: 500px; height: 500px; text-align: center; color: black; 
            background-image: url('assets/Sasuke.jpg'); background-size: cover; background-repeat: no-repeat;">
                <h2>Imagem como background</h2>
                <p>Esta seção tem uma imagem de fundo.</p>
        </div>
        </section>
        <hr>
        <!--Vídeos-->
        <section>
            <h1>Vídeos em HTML</h1>
            <video src="assets/senai.mp4" controls autoplay Loop muted width="500" height="315">
                Seu navegador não suporta o elemento de vídeo.
            </video>
        </section>
        <hr>
        <!--Vídeos Externos iframe-->
        <section>
            <h1>Vídeos Externos</h1>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/xmbxe0Jtxmc?si=AvYFD_W80rkPSycv" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>58
    </main>
</body>
</html>
